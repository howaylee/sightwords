<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grace 单词大冒险</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700&display=swap');

        :root {
            --primary: #FF9A9E;
            --secondary: #FECFEF;
            --accent: #84fab0;
            --text: #555;
            --card-bg: #fff;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f6f9fc;
            background-image: radial-gradient(#dfe9f3 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
            width: 90%;
            max-width: 400px;
        }

        .title {
            font-family: 'Fredoka One', cursive;
            color: #FF6B6B;
            font-size: 24px;
            text-shadow: 2px 2px 0px #fff;
            margin: 0 0 10px 0;
        }

        /* 下拉选择器样式 */
        .level-select-wrapper {
            position: relative;
            display: inline-block;
        }

        select {
            appearance: none;
            background-color: #4FACFE;
            color: white;
            padding: 8px 30px 8px 15px;
            border-radius: 20px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            outline: none;
        }

        .select-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            pointer-events: none;
            font-size: 12px;
        }

        .progress-container {
            width: 80%;
            max-width: 300px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #84fab0 0%, #8fd3f4 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .scene {
            width: 300px;
            height: 400px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: var(--card-bg);
            border: 5px solid white;
        }

        .card-front {
            background: linear-gradient(135deg, #fff 0%, #fefefe 100%);
        }

        .word-text {
            font-family: 'Fredoka One', cursive;
            font-size: 55px; /* 稍微调小一点以适应长单词 */
            color: #4FACFE;
            margin-bottom: 20px;
            word-break: break-all;
            text-align: center;
            line-height: 1.1;
        }

        .tap-hint {
            font-size: 13px;
            color: #ccc;
            position: absolute;
            bottom: 25px;
            animation: bounce 2s infinite;
        }

        .card-back {
            background: #fff8e1;
            transform: rotateY(180deg);
            text-align: center;
        }

        .back-word {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            color: #FF6B6B;
            margin-bottom: 10px;
        }

        .cn-meaning {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .sentence-block {
            width: 90%;
            background: rgba(255,255,255,0.6);
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            text-align: left;
        }

        .sentence-block:last-child {
            margin-bottom: 0;
        }

        .en-sentence {
            font-size: 14px;
            color: #666;
            font-style: italic;
            line-height: 1.4;
        }

        .cn-sentence {
            font-size: 13px;
            color: #888;
            line-height: 1.4;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .btn {
            background: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .btn:active { transform: scale(0.95); }
        .btn-prev { color: #FF9A9E; }
        .btn-next { background: #4FACFE; color: white; }

        .counter {
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-8px);}
            60% {transform: translateY(-4px);}
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">Grace 单词大冒险</h1>
        <div class="level-select-wrapper">
            <select id="levelSelector" onchange="changeLevel()">
                <option value="pp">Level 1: Pre-Primer (40词)</option>
                <option value="p">Level 2: Primer (52词)</option>
                <option value="g1">Level 3: 1st Grade (41词)</option>
                <option value="g2">Level 4: 2nd Grade (46词)</option>
                <option value="g3">Level 5: 3rd Grade (41词)</option>
            </select>
            <div class="select-arrow">▼</div>
        </div>
        <div class="counter" id="counterDisplay">1 / 40</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="scene" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="word-text" id="frontWord">Loading...</div>
                <div class="tap-hint">👆 点我翻面 / Tap to Flip</div>
            </div>
            <div class="card-face card-back">
                <div class="back-word" id="backWord"></div>
                <div class="cn-meaning" id="cnMeaning"></div>
                <div id="sentencesContainer"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-prev" onclick="prevCard()">⬅️ 上一个</button>
        <button class="btn btn-next" onclick="nextCard()">下一个 ➡️</button>
    </div>

        const card = document.getElementById('flashcard');
        const frontWord = document.getElementById('frontWord');
        const backWord = document.getElementById('backWord');
        const cnMeaning = document.getElementById('cnMeaning');
        const sentencesContainer = document.getElementById('sentencesContainer');
        const progressBar = document.getElementById('progressBar');
        const counterDisplay = document.getElementById('counterDisplay');

        // 洗牌算法 (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function changeLevel() {
            const level = document.getElementById('levelSelector').value;
            // 复制一份数据并洗牌
            currentList = shuffle([...db[level]]); 
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (currentList.length === 0) return;

            const item = currentList[currentIndex];
            frontWord.innerText = item.w;
            backWord.innerText = item.w;
            cnMeaning.innerText = item.c;
            
            // 渲染例句（支持多条）
            sentencesContainer.innerHTML = '';
            item.s.forEach(st => {
                const block = document.createElement('div');
                block.className = 'sentence-block';
                block.innerHTML = `<div class="en-sentence">${st.en}</div><div class="cn-sentence">${st.cn}</div>`;
                sentencesContainer.appendChild(block);
            });
            
            // 更新进度条
            const percentage = ((currentIndex + 1) / currentList.length) * 100;
            progressBar.style.width = percentage + "%";
            
            // 更新计数器
            counterDisplay.innerText = `${currentIndex + 1} / ${currentList.length}`;

            // 重置翻转
            card.classList.remove('is-flipped');
        }

        let isFlipping = false;

        function flipCard() {
            if (isFlipping) return;
            isFlipping = true;
            card.classList.toggle('is-flipped');
            setTimeout(() => { isFlipping = false; }, 600);
        }

        function nextCard() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                if(confirm("太棒了！本关单词已学完！要重新打乱顺序再练一次吗？")) {
                    currentList = shuffle([...currentList]);
                    currentIndex = 0;
                    renderCard();
                }
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        // 初始化加载 Level 1
        window.onload = function() {
            changeLevel();
